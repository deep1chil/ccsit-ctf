databases:
  - name: ctf-db
    plan: free
    databaseName: ctfdb
    user: ctfuser

services:
  - type: web
    name: ccsit-ctf
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: DATABASE_URL
        fromDatabase:
          name: ctf-db
          property: connectionString
    plan: free
